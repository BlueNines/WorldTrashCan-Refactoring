# 基础清理策略测试规格。
# 该文件描述所有产物都应尽量执行的共同测试；能力不足的产物必须在报告中写明跳过原因。

id: cleanup-basic
name: "基础物品与实体清理策略"

cases:
  - id: ignored-material
    description: "黑名单物品类型应跳过清理"
    item:
      material: "DIAMOND"
      amount: 1
    expected-route: "SKIP"

  - id: world-trash-first
    description: "存在世界垃圾桶时，普通物品优先进入世界垃圾桶"
    item:
      material: "DIRT"
      amount: 32
    world-trash-available: true
    personal-trash-available: true
    global-trash-available: true
    expected-route: "WORLD_TRASH"

  - id: monster-clean
    description: "开启怪物清理时，怪物实体应被移除"
    entity:
      type: "ZOMBIE"
      living: true
      monster-like: true
    expected-entity-action: "REMOVE"
