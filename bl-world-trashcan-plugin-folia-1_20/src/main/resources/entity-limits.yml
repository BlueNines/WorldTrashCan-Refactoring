# 每个世界的实体数量限制。
world-limits:
  # 是否启用世界实体数量限制。
  enabled: false
  # 不受限制的世界名。
  ignored-worlds:
    - "testWorld"
  # 默认限制列表。
  # 不确定实体类型时，请以玩家身份执行 /wtc look 并右键目标实体。
  # entity 填写输出中的 EntityType 或当前平台标准化类型键；此处按类型精确匹配，不支持 * 通配。
  defaults:
    # 实体类型，使用 Bukkit EntityType 名称或插件标准化后的实体名。
    - entity: "VILLAGER"
      # 单个世界中该实体允许存在的最大数量，超过后新生成会被拦截或进入低占用清理。
      max-count: 10
    # 第二条示例规则，服主可按相同格式继续追加。
    - entity: "CHICKEN"
      # CHICKEN 在单个世界中的默认最大数量。
      max-count: 20

# 低占用实体扫描器。
# Folia 下 global region 只负责挑选 chunk，实体快照采集和删除都会派发到 chunk 所在 region。
# 主线程/region 线程只做少量快照和预算删除，密集判断在异步 worker 中完成。
scanner:
  # 目标完整覆盖周期，单位秒。延迟可以接受时建议保持较大，避免插件自身占用过高。
  target-full-cycle-seconds: 300
  # 扫描任务间隔，单位 tick。20 tick 约等于 1 秒。
  scan-interval-ticks: 20
  # 每轮至少扫描多少个已加载 chunk。
  min-chunks-per-scan: 4
  # 每轮最多扫描多少个已加载 chunk，防止地图很大时单轮压力过高。
  max-chunks-per-scan: 64
  # 每轮扫描分派最多使用多少毫秒，超预算会把未扫到的 chunk 放回脏队列。
  max-scan-millis-per-run: 4
  # 候选删除任务间隔，单位 tick。
  remove-interval-ticks: 2
  # 每轮最多真正移除多少个实体。
  max-removes-per-run: 20
  # 最多排队多少个待删除候选，超过后会丢弃新候选，等待后续扫描再补。
  max-pending-removals: 2000
  # 候选最长保留时间，单位秒。超时后会释放候选，避免长期占用内存。
  candidate-ttl-seconds: 120
  # 候选删除失败后的最大重试次数。
  max-candidate-retries: 3
  # 最多记录多少个脏 chunk，防止实体事件暴涨时队列无限增长。
  max-dirty-chunks: 4096
  # chunk 索引多久没有刷新就视为过期，单位秒。
  stale-chunk-seconds: 600
  # 全局最多索引多少个相关实体。
  max-index-entities: 50000
  # 单个 chunk 最多索引多少个相关实体。
  max-index-entities-per-chunk: 512
  # 后台摘要日志间隔，单位秒。设置为 0 可关闭。
  log-summary-seconds: 60

# 密集实体清理。
gather-limits:
  # 是否启用密集实体清理。
  enabled: false
  # 清理密集实体时是否掉落物品。
  drop-items: true
  # 不受密集实体限制的世界名。
  ignored-worlds:
    - "testWorld"
  # 默认密集限制列表。
  # 不确定实体类型时，请以玩家身份执行 /wtc look 并右键目标实体。
  # entity 填写输出中的 EntityType 或当前平台标准化类型键；此处按类型精确匹配，不支持 * 通配。
  defaults:
    # 实体类型，使用 Bukkit EntityType 名称或插件标准化后的实体名。
    - entity: "VILLAGER"
      # 同一半径内允许存在的最大数量，超过后触发密集实体清理。
      max-count: 10
      # 检测半径，单位为方块；数值越大，每次密集判断需要比较的范围越大。
      radius: 8
      # 条件触发后本轮最多清理多少只，不是只清理超出上限的差值。
      remove-count: 5
