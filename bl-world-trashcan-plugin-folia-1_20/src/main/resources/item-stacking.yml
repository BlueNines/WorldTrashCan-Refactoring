# 地面掉落物逻辑堆叠详细配置。
# 本文件同时包含该功能的独立总开关；默认关闭。
# 关闭时不会探测现代堆叠 API，也不会注册监听器、任务、队列或索引。
# items 只作为本文件中的小型稀疏覆盖表读取一次，也供个人垃圾桶通知统一解析物品名。

# 开启后会先检测实体 PDC、owner、拾取、漏斗、合并和调度 API；能力不足时插件主体仍会正常运行。
enabled: false

stack:
  # 单个掉落物实体最多代表多少个实际物品。
  # 范围 2-2147483647；达到上限后，多出的物品会留在其它实体中，不会被吞掉。
  # items 中 max-stack-size 为 -1 或完全没有独立条目的物品，都会继承此值。
  # 默认 1024；例如下面的 DIAMOND_BLOCK 会被独立限制为 200。
  max-logical-amount: 1024

# 单个物品的独立规则；这里只需要填写确实要覆盖全局设置的 Bukkit Material，不会自动生成完整清单。
# 新增物品时复制 DIAMOND_BLOCK 整段并把键改成目标 Material；键不区分大小写。
items:
  DIAMOND_BLOCK:
    # 是否由本插件接管钻石块的地面逻辑堆叠；false 时保留服务端原版合并行为。
    enabled: true
    # 单个钻石块掉落实体最多代表多少个实际物品；-1 表示继承上面的全局 1024，最小有效值为 2。
    max-stack-size: 200
    # 地面悬浮名和个人桶回收提示共用；default 或空值使用下方 locale 对应的内置名称。
    # 物品自身已有自定义名称时始终优先，不会被这里覆盖。
    display-name: "default"

merge:
  # 水平方向允许聚集的最大距离，单位为方块；范围 0.1-16。
  horizontal-radius: 3.0
  # 垂直方向允许聚集的最大距离，单位为方块；范围 0.1-16。
  vertical-radius: 1.5

scheduler:
  # dirty chunk 队列处理周期，单位 tick；20 tick 约等于 1 秒。
  process-interval-ticks: 5
  # 新掉落物生成后至少等待多少 tick 再参与主动聚集，避免连续生成时重复扫描。
  merge-delay-ticks: 10
  # 每轮最多处理多少个 dirty chunk。
  max-chunks-per-run: 8
  # 每个 chunk 每轮最多检查多少个掉落物实体。
  max-items-per-chunk: 256
  # Folia 每个 region 任务允许占用的最长时间，单位微秒；达到预算立即让出。
  time-budget-micros: 1500
  # dirty chunk 队列最大容量；队列满时丢弃新请求，不会无限占用内存。
  max-queued-chunks: 4096
  # 队列条目最长保留时间，单位秒；过期后自动移除。
  queue-ttl-seconds: 30

display:
  custom-name:
    # 是否在逻辑数量大于 1 时显示掉落物悬浮名称。
    enabled: true
    # {name} 为物品自定义名或内置本地化名称，{amount} 为实际逻辑数量；支持 RGB 和传统 &a 颜色。
    format: "&#38BDF8{name} &#64748Bx &#F5B82E{amount}"
    # 无自定义名的原版物品使用哪种内置语言；地面悬浮名和个人桶回收提示共用；支持 zh_CN、en_US、ja_JP。
    # 修改后执行 /wtc reload 即可刷新已有受管掉落物，不需要重启服务器。
    locale: "zh_CN"
    # 单个物品的显示名覆盖统一配置在本文件根节点 items 中。
    # 修改 enabled、全局上限、items 或 locale 后执行 /wtc reload 生效。
