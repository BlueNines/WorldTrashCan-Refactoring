# 插件前缀，会自动替换 {prefix}。
prefix: "&#64748B[&#5AC8FAWorldListTrashCan&#64748B] "

# 通用无权限提示。
no-permission: "{prefix}&#FFD166No tienes permiso para usar este comando."

# 重载成功提示。
reload-success: "{prefix}&#5AC8FAConfiguracion recargada."

# 公共垃圾桶相关消息。
global-trash:
  # 公共垃圾桶未启用时提示。
  disabled: "{prefix}&#FFD166La papelera global esta desactivada."
  # 玩家没有权限从公共垃圾桶取出物品。
  no-take-permission: "{prefix}&#FFD166No tienes permiso para sacar objetos de la papelera global."
  # 公共垃圾桶拿取冷却提示，{time} 为剩余秒数。
  take-cooldown: "{prefix}&#FFD166Debes esperar {time} segundos antes de sacar otro objeto."
  # 公共垃圾桶 GUI 文案。
  gui:
    # GUI 标题，{page} 当前页，{max} 总页数。
    title: "&#0F172APapelera Global {page}/{max}"
    # 上一页按钮名称。
    back: "&#5AC8FAPagina anterior"
    # 下一页按钮名称。
    next: "&#5AC8FAPagina siguiente"

# 个人垃圾桶相关消息。
personal-trash:
  # 个人垃圾桶未启用时提示。
  disabled: "{prefix}&#FFD166La papelera personal esta desactivada."
  # 玩家没有权限从个人垃圾桶取出物品。
  no-take-permission: "{prefix}&#FFD166No tienes permiso para sacar objetos de la papelera personal."
  # 玩家余额不足时提示。
  not-enough-money: "{prefix}&#FFD166No tienes suficiente dinero para sacar este objeto."
  # 玩家背包空间不足时提示。
  inventory-full: "{prefix}&#FFD166Tu inventario no tiene espacio suficiente para sacar este objeto."
  # 玩家成功支付取出费用，{cost} 为扣费显示。
  pay-success: "{prefix}&#5AC8FAPagaste {cost}."
  # 个人垃圾桶 GUI 文案。
  gui:
    # GUI 标题，{player} 为玩家名。
    title: "&#0F172APapelera personal de {player}"
  # 自动进入个人垃圾桶时的提示文案。
  recycle:
    # 单个来源进入个人垃圾桶时发送，{items} 为格式化后的物品列表。
    single: "{prefix}&#5AC8FARecuperado en la papelera personal: {items}"
    # 批量清理进入个人垃圾桶时发送，{items} 为格式化后的物品列表。
    batch: "{prefix}&#5AC8FALa limpieza recupero objetos en la papelera personal: {items}"
    # 物品列表整体格式，{items} 为已经拼接好的物品条目。
    list: "&#64748B[{items}&#64748B]"
    # 多个物品条目之间的分隔符。
    separator: "&#64748B, "
    # 单个物品数量大于 1 时的条目格式，{name} 为物品名，{amount} 为总数量。
    item: "&#C9D4E2{name}&#64748B*&#C9D4E2{amount}"
    # 单个物品数量等于 1 时的条目格式，{name} 为物品名。
    item-single: "&#C9D4E2{name}"
    # 物品条目超过 trash.yml 中 max-display-items 后追加的省略标记。
    ellipsis: "&#64748B..."

# 黑名单 GUI 相关消息。
ban-gui:
  # 世界黑名单 GUI 标题，{world} 为世界名。
  world-title: "&#0F172ALista negra del mundo: {world}"
  # 公共垃圾桶黑名单 GUI 标题。
  global-title: "&#0F172ALista negra de la papelera global"
  # 保存世界黑名单时世界不存在。
  world-missing: "{prefix}&#FFD166Mundo no encontrado, no se puede guardar la lista negra: {world}"
  # 世界黑名单保存成功，{count} 为物品数量。
  world-save-success: "{prefix}&#5AC8FALista negra del mundo guardada, objetos: &#C9D4E2{count}"
  # 世界黑名单保存失败。
  world-save-fail: "{prefix}&#FFD166No se pudo guardar la lista negra del mundo. Revisa los logs."
  # 公共黑名单保存成功，{count} 为物品数量。
  global-save-success: "{prefix}&#5AC8FALista negra global guardada, objetos: &#C9D4E2{count} &#64748B(aplicado inmediatamente)"
  # 公共黑名单保存失败。
  global-save-fail: "{prefix}&#FFD166No se pudo guardar la lista negra global. Revisa los logs."

# 防护和查询相关消息。
protection:
  # 关闭防丢弃模式。
  drop-mode-off: "{prefix}&#5AC8FAProteccion contra tirar objetos desactivada."
  # 开启防丢弃模式。
  drop-mode-on: "{prefix}&#5AC8FAProteccion contra tirar objetos activada."
  # 防丢弃模式拦截玩家丢弃。
  drop-blocked: "{prefix}&#FFD166La proteccion bloqueo este objeto."
  # look 查询等待玩家右键实体。
  look-prompt: "{prefix}&#5AC8FAHaz clic derecho en una entidad para inspeccionarla."
  # look 查询实体结果，{name} 为实体名，{type} 为实体类型。
  entity-result: "{prefix}&#5AC8FAEntidad: &#C9D4E2{name} &#64748B({type})"
  # 当前区块实体列表标题。
  chunk-entities-title: "{prefix}&#5AC8FAEntidades del chunk actual:"
  # 当前区块实体单行，{text} 为实体名和数量。
  chunk-entity-line: "{prefix}&#5AC8FA{text}"
  # 手持物品查询结果，{material} 为物品类型。
  hand-item: "{prefix}&#5AC8FAObjeto en mano: &#C9D4E2{material}"
  # look nombre visible del objeto, {name} es el nombre personalizado.
  hand-item-name: "{prefix}&#5AC8FANombre visible: &#C9D4E2{name}"
  # título del lore del objeto consultado con look.
  hand-item-lore-title: "{prefix}&#5AC8FALore del objeto:"
  # línea del lore, {line} es el contenido.
  hand-item-lore-line: "{prefix}&#64748B- &#C9D4E2{line}"
  # aviso de truncamiento del lore, {count} es el número de líneas omitidas.
  hand-item-lore-truncated: "{prefix}&#64748B...se omitieron &#FFD166{count} &#64748Blíneas de lore..."

# Mensajes de limite de entidades.
entity-limit:
  # Se envia a jugadores cercanos tras limpiar entidades densas. {range} radio, {entity} tipo, {size} cantidad cercana previa, {max} limite, {removed} cantidad eliminada.
  gather-cleared: "{prefix}&#FFD166Limpieza de entidades densas &#64748B| &#C9D4E2Dentro de &#FFD166{range} &#C9D4E2bloques habia &#FFD166{entity} x {size}&#C9D4E2, sobre el limite &#FFD166{max}&#C9D4E2. Eliminadas &#5AC8FA{removed} &#C9D4E2esta ronda."

# 世界垃圾桶相关消息。
world-trash:
  # 当前世界禁止创建世界垃圾桶。
  create-banned-world: "{prefix}&#FFD166No se pueden crear papeleras de mundo en este mundo."
  # 告示牌没有连接到可用容器。
  create-not-container: "{prefix}&#FFD166El cartel debe estar unido a un contenedor o encima de uno."
  # 当前世界垃圾桶数量达到上限。
  create-reach-limit: "{prefix}&#FFD166Este mundo alcanzo el limite de papeleras."
  # 创建世界垃圾桶成功，{world} 为世界名。
  create-success: "{prefix}&#5AC8FAPapelera de mundo creada en &#C9D4E2{world}&#5AC8FA."
  # 创建世界垃圾桶保存失败。
  create-save-fail: "{prefix}&#FFD166No se pudo guardar la papelera de mundo. Revisa los logs."
  # 移除世界垃圾桶登记成功。
  remove-success: "{prefix}&#5AC8FARegistro de papelera de mundo eliminado."
# 主命令相关消息。
command:
  # 通用无权限提示。
  no-permission: "{prefix}&#FFD166No tienes permiso para usar este comando."
  addon-failed: "{prefix}&#FF6B6BEl comando del complemento fallo &#64748B| &#C9D4E2Revisa el registro del servidor."
  # 重载成功提示。
  reload-success: "{prefix}&#5AC8FAWorldListTrashCan recargado."
  # 手动清理完成提示，{worlds} 世界数，{routed} 回收物品数，{items} 移除物品数，{entities} 移除实体数。
  clear-success: "{prefix}&#5AC8FALimpieza terminada: &#C9D4E2mundos {worlds}&#5AC8FA, objetos enviados {routed}&#5AC8FA, objetos eliminados {items}&#5AC8FA, entidades eliminadas {entities}&#5AC8FA."
  # 手动清理 guards 参数错误时提示。
  clear-guard-usage: "{prefix}&#FFD166Uso: /wtc clear [true/false]. true ignora guards en esta limpieza; false respeta guards."
  # Folia 不支持当前清理扫描时提示。
  folia-clear-unsupported: "{prefix}&#FFD166Esta version Folia no tiene limpieza region-safe activada; se rechazo el escaneo de entidades del mundo."
  # Folia 上一轮清理仍在运行时提示。
  folia-clear-running: "{prefix}&#FFD166La limpieza region-safe anterior de Folia sigue en ejecucion; esta solicitud se omitio."
  # Folia 清理任务启动成功提示。
  folia-clear-started: "{prefix}&#5AC8FALimpieza region-safe de Folia iniciada; revisa los logs [FoliaCleanup] o ejecuta /wtc stats al terminar."
  # 没有打开公共垃圾桶权限时提示。
  no-global-open-permission: "{prefix}&#FFD166No tienes permiso para abrir la papelera global."
  # 没有打开个人垃圾桶权限时提示。
  no-personal-open-permission: "{prefix}&#FFD166No tienes permiso para abrir la papelera personal."
  # /wtc help 输出，每行一条。主帮助只展示正式命令；调试命令请使用 /wtc debughelp。
  help:
    - "&#5AC8FA/wtc help &#64748B- Ver ayuda"
    - "&#5AC8FA/wtc platform &#64748B- Ver capacidades de esta version"
    - "&#5AC8FA/wtc clear [true/false] &#64748B- Ejecutar limpieza; true ignora guards, false los respeta"
    - "&#5AC8FA/wtc global &#64748B- Abrir papelera global"
    - "&#5AC8FA/wtc personal &#64748B- Abrir papelera personal"
    - "&#5AC8FA/wtc dropmode &#64748B- Alternar proteccion de soltar"
    - "&#5AC8FA/wtc look &#64748B- Inspeccionar item en mano y entidad clicada"
    - "&#5AC8FA/wtc ban &#64748B- Abrir blacklist de papeleras del mundo"
    - "&#5AC8FA/wtc globalban &#64748B- Abrir blacklist global"
    - "&#5AC8FA/wtc stats &#64748B- Ver estadisticas de limpieza y papeleras"
    - "&#5AC8FA/wtc add <cantidad> &#64748B- Agregar espacios al mundo actual"
    - "&#5AC8FA/wtc add <mundo> <cantidad> &#64748B- Agregar espacios a un mundo especifico"
    - "&#5AC8FA/wtc debughelp &#64748B- Ver comandos de depuracion"
    - "&#5AC8FA/wtc reload &#64748B- Recargar el plugin"
  # /wtc debughelp 输出，每行一条。调试命令会改变测试服运行态，不作为普通玩家功能展示。
  debug-help:
    - "&#5AC8FA/wtc debugopen <jugador> <global|personal> &#64748B- Probar apertura de GUI"
    - "&#5AC8FA/wtc debugworldtrash <jugador> &#64748B- Crear y registrar una papelera de prueba"
    - "&#5AC8FA/wtc debugroute <jugador> <world|personal|global> <Material> <cantidad> &#64748B- Probar una ruta"
    - "&#5AC8FA/wtc debugdrop <jugador> <Material> <cantidad> [owner] &#64748B- Crear un objeto tirado de prueba"
    - "&#5AC8FA/wtc debugdamage <jugador> <Material> <cantidad> &#64748B- Probar recuperacion por dano"
    - "&#5AC8FA/wtc debugstock &#64748B- Ver stock interno de papeleras"
    - "&#5AC8FA/wtc debugsummary <jugador> &#64748B- Ver resumen de pruebas"
    - "&#5AC8FA/wtc debugdensity &#64748B- Ver escaneo de densidad y cola de candidatos"
    - "&#5AC8FA/wtc debugnotify <count> &#64748B- Disparar el aviso de cleanup.yml para ese contador"
    - "&#5AC8FA/wtc debugplayer <jugador> <dropmode|look|ban|globalban> &#64748B- Probar entradas de jugador"
    - "&#5AC8FA/wtc debugrgb <jugador> &#64748B- Probar canales visibles RGB/degradados"
    - "&#5AC8FA/wtc debugrgbchannels <jugador> &#64748B- Probar Chat, ActionBar y Title RGB/degradados"
    - "&#64748BEstos comandos cambian el estado del servidor de pruebas; usalos solo para validacion y diagnostico."
  # 平台信息标题，{platform} 为平台 ID。
  platform:
    header: "{prefix}&#5AC8FAPlataforma actual: &#C9D4E2{platform}"
    # 平台能力已启用文案。
    enabled: "&#5AC8FAActivado"
    # 平台能力已禁用文案。
    disabled: "&#64748BDesactivado"
    # 平台能力单行，{capability} 为能力名，{state} 为启用状态。
    line: "&#64748B- &#C9D4E2{capability}&#64748B: {state}"
  # /wtc stats 输出。
  stats:
    header: "{prefix}&#5AC8FAEstadisticas de limpieza:"
    worlds: "&#64748B- &#C9D4E2Mundos: &#5AC8FA{worlds}"
    routed: "&#64748B- &#C9D4E2Objetos enviados: &#5AC8FA{routed} &#64748B(mundo {world}, personal {personal}, global {global})"
    removed-items: "&#64748B- &#C9D4E2Objetos eliminados: &#5AC8FA{items}"
    removed-entities: "&#64748B- &#C9D4E2Entidades eliminadas: &#5AC8FA{entities}"
    global-pages: "&#64748B- &#C9D4E2Paginas de papelera global: &#5AC8FA{pages}"
    global-items: "&#64748B- &#C9D4E2Objetos en papelera global: &#5AC8FA{items} &#64748B(stacks {stacks})"
    personal-loaded: "&#64748B- &#C9D4E2Papeleras personales cargadas: &#5AC8FA{count}"
    remaining: "&#64748B- &#C9D4E2Segundos hasta la proxima limpieza: &#5AC8FA{seconds}"
  # 找不到世界时提示，{world} 为输入的世界名。
  world-not-found: "{prefix}&#FFD166Mundo no encontrado: &#C9D4E2{world}"
  # 控制台执行 add 未指定世界时提示。
  add-console-world-required: "{prefix}&#FFD166La consola debe especificar un mundo al usar add."
  # add 数量不是正数时提示。
  add-positive-required: "{prefix}&#FFD166La cantidad debe ser mayor que 0."
  # add 成功提示，{world} 为世界名，{count} 为调整后的上限。
  add-success: "{prefix}&#5AC8FAEl limite de papeleras del mundo &#C9D4E2{world} &#5AC8FAahora es &#C9D4E2{count}&#5AC8FA."
  # add 用法提示。
  add-usage:
    - "&#FFD166Uso: /wtc add <cantidad>"
    - "&#FFD166Uso: /wtc add <mundo> <cantidad>"
  # 没有防丢弃模式权限时提示。
  no-dropmode-permission: "{prefix}&#FFD166No tienes permiso para usar la proteccion contra tirar objetos."
  # 没有 look 查询权限时提示。
  no-look-permission: "{prefix}&#FFD166No tienes permiso para usar la inspeccion look."
  # 没有世界黑名单权限时提示。
  no-world-ban-permission: "{prefix}&#FFD166No tienes permiso para abrir la lista negra del mundo."
  # 没有公共黑名单权限时提示。
  no-global-ban-permission: "{prefix}&#FFD166No tienes permiso para abrir la lista negra global."
  # 非玩家执行玩家命令时提示。
  only-player: "{prefix}&#FFD166Este comando solo puede ser usado por jugadores."
  # 玩家不在线时提示，{player} 为玩家名。
  player-offline: "{prefix}&#FFD166Jugador no conectado: {player}"
