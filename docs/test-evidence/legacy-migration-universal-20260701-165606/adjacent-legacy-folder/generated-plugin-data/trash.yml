# 世界垃圾桶设置。
world-trash:
  enabled: true
  sign-create-text: '[trash]'
  sign-created-text: '[created]'
  default-max-count: 9
  allow-load-unloaded-chunks: false
  banned-worlds:
  - banned_world
global-trash:
  enabled: true
  max-pages: 7
  take-delay-millis: 250
  allow-player-put: true
  clear-every-cleanups: 3
  log-enabled: true
  gui:
    back-model-id: 101
    next-model-id: 102
    background-model-id: 103
  banned-materials:
  - DIRT
  - COBBLESTONE
personal-trash:
  enabled: true
  track-player-dropped-items: true
  auto-clear-when-full: true
  take-cost: 4.5
  notify:
    enabled: true
    max-display-items: 3
  damage-recovery:
    mode: global-trash
    delay-seconds: 5
