# 语言文件名。
# 默认使用 messages/message_zh.yml；后续可切换到其他语言文件。
language: message_zh.yml

# 是否开启调试日志。
# 默认 false；开启后会输出配置加载、功能启停、清理决策等额外信息。
debug: false

# 是否允许旧 WorldListTrashCan 配置迁移。
# 默认 true；首次检测到当前目录旧结构，或相邻旧插件目录中的 config.yml 和 data/data.yml 时会生成迁移报告。
migration-enabled: true

# 旧 WorldListTrashCan 插件数据目录名或绝对路径。
# 默认 WorldListTrashCan，表示读取 plugins/WorldListTrashCan/config.yml 和 plugins/WorldListTrashCan/data/data.yml。
# 如果你把旧配置手动放进本插件数据目录，迁移器会优先识别当前目录，不需要改这里。
migration-legacy-folder: WorldListTrashCan
