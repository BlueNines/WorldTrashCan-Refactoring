# 清理周期，单位秒。
# 默认 360 秒；设为 0 时只允许管理员手动触发清理。
interval-seconds: 73
ignored-worlds:
- legacy_ignore
guards:
  min-online-players: 1
  min-total-entities: 150
folia:
  timeout-seconds: 30
  max-chunks-per-cleanup: 4096
  chunk-batch-size: 64
  chunk-batch-delay-ticks: 1
ignored-materials:
- DIAMOND_BLOCK
ignored-name-fragments:
- legacy_name_guard
ignored-lore-fragments:
- legacy_lore_guard
entities:
  enabled: false
  clear-experience-orbs: true
  clear-monsters: true
  clear-animals: false
  clear-projectiles: true
  clear-named-entities: false
  ignore-entities-in-boat: true
  whitelist:
  - VILLAGER
  - '*GOLEM*'
  blacklist:
  - LEGACY_CUSTOM_ENTITY
notify:
  chat:
    enabled: true
    click-command: /wtc stats
    messages:
    - 0;&a旧清理完成
  console:
    enabled: true
    details-enabled: true
    max-entries: 10
    entity-format: '{name}_{type}: {count}'
    items-format: 'items: {count}'
    others-format: 'others: {count}'
  actionbar:
    enabled: true
    messages:
    - 0;&b旧ActionBar
  bossbar:
    enabled: true
    messages:
    - 0;&6旧BossBar;SOLID;YELLOW
  title:
    enabled: true
    messages:
    - 0;&e旧标题;&7旧副标题
  sound:
    enabled: true
    messages:
    - 0;ENTITY_EXPERIENCE_ORB_PICKUP;1;1
  command:
    enabled: true
    commands:
    - 0;say legacy-command
