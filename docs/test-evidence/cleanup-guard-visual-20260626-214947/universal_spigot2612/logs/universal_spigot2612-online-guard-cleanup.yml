# 清理周期，单位秒。
# 默认 360 秒；设为 0 时只允许管理员手动触发清理。
interval-seconds: 0

# 跳过清理的世界名。
# 默认示例为 testWorld；留空请写 []。
ignored-worlds:
  - "testWorld"

# 不回收也不删除的物品类型。
# 使用当前版本平台标准化后的 Material 名称。
ignored-materials:
  - "DIAMOND"

# 显示名包含以下片段时跳过清理。
# 可用于保护特殊商店、祭坛、任务物品。
ignored-name-fragments:
  - "shopLocation"
  - "ALTAR"

# lore 包含以下片段时跳过清理。
# 默认保护 QuickShop 一类带位置 lore 的物品。
ignored-lore-fragments:
  - "shopLocation"

# 实体清理规则。
entities:
  # 是否启用实体清理总开关。
  # 默认 true；改为 false 时，经验球、怪物、动物、投射物、实体黑名单等实体清理规则都会整体跳过。
  enabled: true
  # 是否清理经验球。
  clear-experience-orbs: true
  # 是否清理怪物。
  clear-monsters: true
  # 是否清理动物或普通生物。
  clear-animals: false
  # 是否清理投射物。
  clear-projectiles: true
  # 是否清理带自定义名的实体。
  clear-named-entities: false
  # 是否跳过船内实体。
  ignore-entities-in-boat: false
  # 实体白名单；命中后不清理，支持 * 通配。
  whitelist:
    - "VILLAGER"
    - "*golem*"
    - "WITHER"
    - "Ender Dragon"
  # 实体黑名单；命中后强制清理，支持 * 通配。白名单优先级更高。
  blacklist:
    - "FLAMMPFEIL.SLASHBLADE_BLADESTAND"

# 清理通知配置。
# 这些通知都属于扫地功能的一部分，因此统一放在 cleanup.yml 中维护。
notify:
  # 聊天栏提醒。
  chat:
    # 是否启用聊天提醒。
    enabled: true
    # 是否同步输出到控制台。
    console-log: true
    # 清理完成消息点击后执行的命令。
    click-command: "/worldlisttrashcan globaltrash"
    # 倒计时聊天提醒，格式：剩余秒数;内容。
    messages:
      - "60;&d还剩下 60 秒清理物品和实体"
      - "30;&d还剩下 30 秒清理物品和实体"
      - "10;&d还剩下 10 秒清理物品和实体"
      - "5;&c5秒"
      - "3;&c3秒"
      - "2;&c2秒"
      - "1;&c1秒"
      - "0;&a清理成功，有%DealItemSum%个物品被回收，有%GlobalTrashAddSum%个物品加入了公共垃圾桶，有%EntitySum%个生物被清理 &6(点我打开垃圾桶)"
      # -1 表示本轮清理完成但公共垃圾桶未刷新，-2 表示公共垃圾桶已刷新。
      - "-1;&d还有%ClearGlobalCount%次清理，公共垃圾桶会刷新"
      - "-2;&a公共垃圾桶的物品已刷新"
      # -5 表示本轮被扫地启动门禁跳过。
      - "-5;&#FFD166本轮扫地已跳过 &#64748B| &#C9D4E2原因: &#FFD166%CleanupSkipReason% &#C9D4E2在线 &#FFD166%CleanupOnlinePlayers%/%CleanupMinOnlinePlayers% &#C9D4E2目标实体 &#FFD166%CleanupTargetEntities%/%CleanupMinTotalEntities%"

  # ActionBar 提醒。
  actionbar:
    # 是否启用 ActionBar。
    enabled: true
    # 倒计时 ActionBar 提醒，格式：剩余秒数;内容。
    messages:
      - "60;&d&l还剩下 60 秒清理物品和实体"
      - "30;&d&l还剩下 30 秒清理物品和实体"
      - "10;&d&l还剩下 10 秒清理物品和实体"
      - "5;&c&l5秒"
      - "3;&c&l3秒"
      - "2;&c&l2秒"
      - "1;&c&l1秒"
      - "0;&a清理成功，有%GlobalTrashAddSum%个物品加入了公共垃圾桶，有%EntitySum%个生物被清理"
      # -1 表示本轮清理完成但公共垃圾桶未刷新，-2 表示公共垃圾桶已刷新。
      - "-1;&d还有%ClearGlobalCount%次清理，公共垃圾桶会刷新"
      - "-2;&a公共垃圾桶的物品已刷新"
      # -5 表示本轮被扫地启动门禁跳过。
      - "-5;&#0F172A▌ &#FFD166本轮扫地已跳过 &#64748B| &#C9D4E2%CleanupSkipReason% &#FFD166%CleanupOnlinePlayers%/%CleanupMinOnlinePlayers% &#C9D4E2目标 &#FFD166%CleanupTargetEntities%/%CleanupMinTotalEntities%"

  # BossBar 提醒。
  bossbar:
    # 是否启用 BossBar。
    enabled: false
    # 倒计时 BossBar 提醒，格式：剩余秒数;内容;样式;颜色。
    # 样式可用 SOLID、SEGMENTED_6、SEGMENTED_10、SEGMENTED_12、SEGMENTED_20；颜色可用 PINK、BLUE、RED、GREEN、YELLOW、PURPLE、WHITE。
    # -1 表示本轮清理完成但公共垃圾桶未刷新，-2 表示公共垃圾桶已刷新。
    messages:
      - "30;&d&l即将清理物品和实体;SOLID;RED"
      - "10;&d&l即将清理物品和实体;SOLID;YELLOW"
      - "5;&c&l5秒;SEGMENTED_20;RED"
      - "3;&c&l3秒;SEGMENTED_20;RED"
      - "2;&c&l2秒;SEGMENTED_20;RED"
      - "1;&c&l1秒;SEGMENTED_20;RED"
      - "0;&a清理成功，有%GlobalTrashAddSum%个物品加入了公共垃圾桶，有%EntitySum%个生物被清理;SEGMENTED_20;GREEN"
      - "-1;&d还有%ClearGlobalCount%次清理，公共垃圾桶会刷新;SEGMENTED_20;GREEN"
      - "-2;&a公共垃圾桶的物品已刷新;SEGMENTED_20;GREEN"
      # -5 表示本轮被扫地启动门禁跳过。
      - "-5;&#FFD166本轮扫地已跳过：%CleanupSkipReason%，在线 %CleanupOnlinePlayers%/%CleanupMinOnlinePlayers%，目标实体 %CleanupTargetEntities%/%CleanupMinTotalEntities%;SEGMENTED_20;YELLOW"

  # Title 提醒。
  title:
    # 是否启用 Title。
    enabled: false
    # 倒计时 Title 提醒，格式：剩余秒数;主标题;副标题。
    messages:
      - "60;&d还剩下 60 秒;清理物品和实体"
      - "30;&d还剩下 30 秒;清理物品和实体"
      - "10;&d还剩下 10 秒;清理物品和实体"
      - "5;&c5秒;"
      - "3;&c3秒;"
      - "2;&c2秒;"
      - "1;&c1秒;"
      - "0;&a清理成功;有%GlobalTrashAddSum%个物品加入了公共垃圾桶，有%EntitySum%个生物被清理"
      # -1 表示本轮清理完成但公共垃圾桶未刷新，-2 表示公共垃圾桶已刷新。
      - "-1;&d还有%ClearGlobalCount%次清理，公共垃圾桶会刷新;"
      - "-2;&a公共垃圾桶的物品已刷新;"
      # -5 表示本轮被扫地启动门禁跳过。
      - "-5;&#FFD166扫地已跳过;&#C9D4E2%CleanupSkipReason% 在线 %CleanupOnlinePlayers%/%CleanupMinOnlinePlayers% 目标实体 %CleanupTargetEntities%/%CleanupMinTotalEntities%"

  # 声音提醒。
  sound:
    # 是否启用提示音。
    enabled: true
    # 倒计时声音提醒，格式：剩余秒数;声音名,音量,音调。
    messages:
      - "5;entity.experience_orb.pickup,0.4,0.2"
      - "3;entity.experience_orb.pickup,0.4,0.4"
      - "2;entity.experience_orb.pickup,0.4,0.6"
      - "1;entity.experience_orb.pickup,0.4,0.8"
      - "0;entity.experience_orb.pickup,0.4,1"

  # 控制台命令提醒。
  command:
    # 是否启用倒计时命令。
    enabled: false
    # 倒计时命令，格式：剩余秒数;命令1;命令2。
    commands:
      - "0;say &amm怪物已清理成功"

# AI 扫地门禁测试临时补入，测试结束后恢复原文件。
guards:
  min-online-players: 2
  min-total-entities: 0
