name: BlWorldTrashCan
version: ${project.version}
main: pixeltech.bluenine.blworldtrashcan.plugin.BlWorldTrashCanPlugin
api-version: '1.16'
author: BlueNine
softdepend:
  - Vault
  - PlaceholderAPI
commands:
  blworldtrashcan:
    description: BlWorldTrashCan 主命令
    aliases:
      - blwtc
  worldlisttrashcan:
    description: WorldListTrashCan 旧命令兼容入口
    aliases:
      - WorldListTrashCan
      - WTC
      - wtc
permissions:
  blworldtrashcan.admin:
    description: 允许重载插件并查看调试信息
    default: op
  blworldtrashcan.use:
    description: 允许使用基础垃圾桶功能
    default: true
  blworldtrashcan.world.create:
    description: 允许创建世界垃圾桶
    default: true
  blworldtrashcan.global.open:
    description: 允许打开公共垃圾桶
    default: true
  blworldtrashcan.global.take:
    description: 允许从公共垃圾桶取出物品
    default: true
  blworldtrashcan.global.put:
    description: 允许向公共垃圾桶放入物品
    default: true
  blworldtrashcan.personal.open:
    description: 允许打开个人垃圾桶
    default: true
  blworldtrashcan.personal.take:
    description: 允许从个人垃圾桶取出物品
    default: true
  blworldtrashcan.personal.put:
    description: 允许向个人垃圾桶放入物品
    default: true
  blworldtrashcan.dropmode:
    description: 允许切换防丢弃模式
    default: true
  blworldtrashcan.look:
    description: 允许查询手持物品和实体类型
    default: op
  WorldListTrashCan.Main:
    description: 旧权限：允许创建世界垃圾桶
    default: true
  WorldListTrashCan.BanGui:
    description: 旧权限：打开世界黑名单 GUI
    default: true
  WorldListTrashCan.GlobalTrashOpen:
    description: 旧权限：打开公共垃圾桶
    default: true
  WorldListTrashCan.GlobalTrashTakeItem:
    description: 旧权限：从公共垃圾桶取出物品
    default: true
  WorldListTrashCan.GlobalTrashPutItem:
    description: 旧权限：向公共垃圾桶放入物品
    default: true
  WorldListTrashCan.PersonalTrashTakeItem:
    description: 旧权限：从个人垃圾桶取出物品
    default: true
  WorldListTrashCan.PersonalTrashPutItem:
    description: 旧权限：向个人垃圾桶放入物品
    default: true
  WorldListTrashCan.help:
    description: 旧权限：查看帮助
    default: true
  WorldListTrashCan.GlobalBan:
    description: 旧权限：公共垃圾桶黑名单 GUI
    default: false
  WorldListTrashCan.Look:
    description: 旧权限：查询实体类型
    default: false
  WorldListTrashCan.DropMode:
    description: 旧权限：防丢弃模式
    default: true
  WorldListTrashCan.PlayerTrash:
    description: 旧权限：打开个人垃圾桶
    default: true
