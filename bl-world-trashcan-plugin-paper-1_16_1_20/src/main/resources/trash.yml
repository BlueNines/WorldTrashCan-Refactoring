# 配置结构版本，由插件自动维护；请勿手动删除或降低。
config-schema-version: 2

# 世界垃圾桶设置。
world-trash:
  # 是否启用世界垃圾桶。
  enabled: true
  # 玩家创建世界垃圾桶时告示牌需要填写的文本。
  sign-create-text: "[世界垃圾桶]"
  # 创建成功后告示牌显示的文本。
  sign-created-text: "&#5AC8FA[&#FFD166世界垃圾桶&#5AC8FA]"
  # 普通玩家每个世界默认可创建的垃圾桶数量。
  default-max-count: 3
  # 是否允许清理任务写入未加载区块里的世界垃圾桶。
  # 默认 false：清理时只访问已加载区块里的世界垃圾桶，未加载位置会跳过并降级到个人或公共垃圾桶，避免同步加载区块造成卡顿。
  # 改为 true：会尽量保持旧插件行为，但可能在后台清理时同步加载远处区块，垃圾桶多或磁盘慢时会明显影响性能。
  allow-load-unloaded-chunks: false
  # 禁止创建世界垃圾桶的世界名。
  banned-worlds:
    - "world"
    - "DIM-1"
    - "DIM1"

# 公共垃圾桶设置。
global-trash:
  # 不确定材质名称时，请以玩家身份执行 /wtc look，手持目标物品即可查看当前版本 Material 名称。
  # 是否启用公共垃圾桶。
  enabled: true
  # 公共垃圾桶显示模式；compact 为紧凑模式，stacked 保留旧版按 64/16/1 堆叠显示。
  mode: "compact"
  # 紧凑模式配置；每个逻辑物品只显示一个展示物，真实数量写入 Lore。
  compact:
    # 玩家第一次打开紧凑模式时使用的排序；可选 insertion、amount-desc、amount-asc、name-asc、material-asc。
    # 玩家可在 GUI 中单独切换，偏好仅保存在在线期间，重连或重启后恢复此默认值。
    default-sort: "insertion"
    # 紧凑模式最多显示多少页；实际可存储的物品种类由页数和 content 槽位数量共同决定。
    max-pages: 5
    # 单个逻辑物品最多累计多少个；-1 表示无限。超过上限时会尽量接受到上限，不会拆成多次循环。
    max-amount-per-entry: 9999
    # 普通左键从紧凑条目取出多少个。
    left-click-amount: 1
    # Shift + 左键从紧凑条目取出多少个。
    shift-left-click-amount: 64
    # 是否启用右键取出；默认关闭，避免改变旧版右键交互习惯。
    right-click-enabled: false
    # 右键从紧凑条目取出多少个。
    right-click-amount: 1
    # Shift + 右键从紧凑条目取出多少个。
    shift-right-click-amount: 64
    # 最多保留多少行原始物品 Lore；-1 表示全部保留。
    max-original-lore-lines: 5
    # 紧凑展示物的完整 Lore 模板，列表顺序就是游戏内顺序；支持 RGB、传统颜色和 PlaceholderAPI 变量。
    # {content} 必须独占一行，用于在当前位置展开原物品 Lore；没有它表示隐藏原 Lore，配置多个时只展开第一个。
    # 可使用 {amount}、{take-amount}、{shift-take-amount}、{right-take-amount}、{shift-right-take-amount}、{page}、{max-page}。
    item-lore:
      - "&#38BDF8数量：&#F5B82E{amount}"
      - "{content}"
      - "&#38BDF8左键 &#D5DEE9取出 &#F5B82E{take-amount} &#D5DEE9个"
      - "&#FFD166Shift + 左键 &#D5DEE9取出 &#F5B82E{shift-take-amount} &#D5DEE9个"
    # 原始 Lore 超过上限时追加的省略模板；{count} 为被隐藏的行数。
    omitted-lore: "&#64748B...省略 &#AAB6C5{count} &#64748B行..."
  # 旧版堆叠显示模式配置；每个展示物按物品原本最大堆叠数显示，不使用紧凑模式 Lore。
  stacked:
    # 堆叠模式自己的默认排序，不读取 compact.default-sort。
    default-sort: "insertion"
    # 旧版模式最多显示多少页。
    max-pages: 5
  # 拿取冷却，单位毫秒。
  take-delay-millis: 500
  # 是否允许玩家把背包物品手动放入公共垃圾桶。
  allow-player-put: true
  # 每多少次清理后刷新公共垃圾桶；-1 表示永不自动刷新。
  clear-every-cleanups: 3
  # 是否记录玩家从公共垃圾桶拿取、放入物品的日志。
  log-enabled: true
  # 公共垃圾桶 GUI 布局设置。
  gui:
    # 小型字符布局配置，决定菜单行数、内容槽和按钮位置。
    layout:
      # 菜单槽位布局；支持 1-6 行，每行必须正好包含 9 个英文字母、数字或下划线。
      position:
        - "xxxxxxxxx"
        - "xxxxxxxxx"
        - "xxxxxxxxx"
        - "xxxxxxxxx"
        - "xxxxxxxxx"
        - "abbsbbbbc"
      # position 中每个字符对应的槽位定义。
      items:
        # x 是默认公共垃圾桶内容槽字符。
        x:
          # content 表示公共垃圾桶内容槽；内容槽不会生成展示物。
          type: "content"
        # a 是默认上一页按钮字符。
        a:
          # previous-page 表示上一页按钮。
          type: "previous-page"
          # 是否显示附魔光效；1.20.5+ 使用无附魔数据的 Bukkit 纯光效，旧版本自动降级为隐藏附魔。
          glow: false
          # CustomModelData；-1 表示不设置，仅 Minecraft 1.14 及以上读取。
          model-id: -1
          # 按顺序使用当前服务端存在的第一个材质；全部无效时降级为 STONE 并输出警告。
          material:
            - "ARROW"
          # 没有上一页时显示哪个布局字符对应的展示物；留空表示该槽位显示为空。
          unavailable-item: "b"
          # 可选名称；不配置时读取当前语言文件的上一页名称，支持 RGB、传统颜色和页码占位符。
          # name: "&#5AC8FA上一页"
          # 可选 Lore；支持 {page}、{max-page}、{previous-page}、{next-page}，留空请写 []。
          # lore:
          #   - "&#C9D4E2当前第 &#FFD166{page} &#C9D4E2页"
        # b 是默认背景板字符。
        b:
          # background 表示不可操作的背景展示物。
          type: "background"
          # 是否显示附魔光效；只改变这个背景展示物的外观，默认关闭。
          glow: false
          # CustomModelData；-1 表示不设置，仅 Minecraft 1.14 及以上读取。
          model-id: -1
          # 新版本优先使用黑色玻璃板，旧版本按顺序降级。
          material:
            - "BLACK_STAINED_GLASS_PANE"
            - "STAINED_GLASS_PANE"
            - "GLASS_PANE"
          # 单个空格用于隐藏原版物品名称；写成空字符串则完全不设置自定义名称。
          name: " "
          # 背景板默认没有 Lore。
          lore: []
        # s 是玩家自己的排序按钮；切换只影响该玩家当前模式，不改变公共垃圾桶真实存储顺序。
        s:
          # sort 表示内置排序按钮；左键下一种、右键上一种，并显式打开新的排序快照。
          type: "sort"
          # 是否显示附魔光效；只改变排序按钮外观，不影响排序和存储逻辑。
          glow: false
          # CustomModelData；-1 表示不设置，仅 Minecraft 1.14 及以上读取。
          model-id: -1
          # 高版本优先使用 COMPARATOR，旧版本自动尝试 REDSTONE_COMPARATOR。
          material:
            - "COMPARATOR"
            - "REDSTONE_COMPARATOR"
          # 名称和 Lore 默认读取语言文件；也可取消注释自行覆盖，支持 {sort}、{next-sort}、{previous-sort}。
          # name: "&#FFD166排序方式"
          # lore:
          #   - "&#C9D4E2当前：&#FFD166{sort}"
        # c 是默认下一页按钮字符。
        c:
          # next-page 表示下一页按钮。
          type: "next-page"
          # 是否显示附魔光效；true 时高版本没有真实附魔，旧版本会隐藏降级附魔的名称。
          glow: false
          # CustomModelData；-1 表示不设置，仅 Minecraft 1.14 及以上读取。
          model-id: -1
          # 按顺序使用当前服务端存在的第一个材质。
          material:
            - "ARROW"
          # 没有下一页时显示哪个布局字符对应的展示物；留空表示该槽位显示为空。
          unavailable-item: "b"
          # 可选名称；不配置时读取当前语言文件的下一页名称。
          # name: "&#5AC8FA下一页"
          # 可选 Lore；留空请写 []。
          # lore:
          #   - "&#C9D4E2共 &#FFD166{max-page} &#C9D4E2页"
        # actions 自定义按钮示例：先把 position 中准备放按钮的位置改成未使用字符，例如 d，再取消下面配置的注释。
        # d:
        #   # actions 表示点击后按顺序执行 actions 列表；按钮不可拿取、拖动或用数字键移动。
        #   type: "actions"
        #   # 是否显示附魔光效；只影响这个 actions 展示按钮。
        #   glow: false
        #   # CustomModelData；-1 表示不设置，仅 Minecraft 1.14 及以上读取。
        #   model-id: -1
        #   # 按顺序使用当前服务端存在的第一个材质；全部无效时降级为 STONE 并输出警告。
        #   material:
        #     - "BOOK"
        #   # 名称和 Lore 支持 RGB、传统颜色、内置变量和 PlaceholderAPI 变量。
        #   name: "&#FFD166垃圾桶统计"
        #   lore:
        #     - "&#C9D4E2玩家: &f{player}"
        #     - "&#C9D4E2等级: &f%player_level%"
        #     - "&#79879C点击查看第 {page}/{max-page} 页统计"
        #   # 动作从上到下分派；[console] 是控制台命令，[command] 是玩家命令，[message] 是玩家消息，[close] 关闭当前菜单。
        #   # [close] 不需要参数，必须单独写成 "[close]"；关闭后列表中的后续动作仍会继续执行。
        #   # 命令开头的 / 可以省略；未知动作会被跳过并在后台警告。
        #   # 内置变量: {player}、{uuid}、{world}、{page}、{max-page}、{previous-page}、{next-page}。
        #   # 安装 PlaceholderAPI 后支持 %...% 变量；未安装时保留 PAPI 原文，其它功能不受影响。
        #   # actions 按钮可被玩家重复点击，不要直接配置没有领取限制的奖励命令。
        #   actions:
        #     - "[message] &#5AC8FA当前位于公共垃圾桶第 &#FFD166{page}/{max-page} &#5AC8FA页"
        #     - "[command] wtc stats"
        #     - "[close]"
        # close 关闭按钮示例：在 position 中放入对应字符后，点击该槽位会直接关闭当前菜单。
        # e:
        #   # close 不需要 actions；任意点击方式都会关闭当前玩家的公共垃圾桶菜单。
        #   type: "close"
        #   # 是否显示附魔光效；只影响这个 close 展示按钮。
        #   glow: false
        #   # CustomModelData；-1 表示不设置，仅 Minecraft 1.14 及以上读取。
        #   model-id: -1
        #   # 按顺序使用当前服务端存在的第一个材质；不配置时默认使用 BARRIER。
        #   material:
        #     - "BARRIER"
        #   # 可选名称和 Lore，支持 RGB、传统颜色、内置变量和 PlaceholderAPI 变量。
        #   name: "&#F87171关闭菜单"
        #   lore:
        #     - "&#C9D4E2点击关闭公共垃圾桶"
  # 公共垃圾桶准入白名单；关闭时保持旧版“除黑名单外都可进入”的行为。
  admission-whitelist:
    # 默认关闭；开启后以下五类规则任意命中才允许进入公共垃圾桶。
    enabled: false
    # Material 不含 * 时完整匹配，支持例如 "*_LOG"。
    material-patterns: []
    # 名称不含 * 时按包含匹配。
    name-key-patterns: []
    # Lore 每行独立匹配，不跨行。
    lore-key-patterns: []
    # Bukkit 1.14+ 的 PDC 命名键；低版本不支持时会输出明确告警。
    pdc-key-patterns: []
    # 原始 NBT/Data Components key 路径；建议先执行 /wtc look。
    nbt-key-patterns: []
    # 扫地物品被白名单拒绝且没有世界桶或个人桶去向时，可选 keep-ground、direct-remove。
    rejected-cleanup-action: "keep-ground"

  # 不允许进入公共垃圾桶的物品类型；黑名单优先于上面的白名单。
  # 使用当前版本标准化后的 Material 名称，按完整名称精确匹配，不支持 * 通配。
  # 不确定名称时请执行 /wtc look；该指令需要 WorldListTrashCan.Look 权限。
  banned-materials:
    - "EGG"
    - "DIRT"

# 个人垃圾桶设置。
personal-trash:
  # 是否启用个人垃圾桶。
  enabled: true
  # 个人垃圾桶显示模式；compact 为紧凑累计模式，stacked 为旧版原始堆叠模式。
  mode: "compact"
  # 紧凑模式配置；相同物品只占一个展示槽，真实累计数量显示在 Lore 中。
  compact:
    # 玩家首次打开时使用的排序；可选 insertion、amount-desc、amount-asc、name-asc、material-asc。
    default-sort: "insertion"
    # 紧凑模式最多存储页数；总物品种类上限为页数乘以每页 content 槽数量。
    max-pages: 2
    # 单种物品最多累计数量；-1 表示无限，达到上限后只接收到上限，剩余物品保留原处。
    max-amount-per-entry: 9999
    # 普通左键取出数量。
    left-click-amount: 1
    # Shift + 左键取出数量。
    shift-left-click-amount: 64
    # 是否启用右键取出；默认关闭以避免误操作。
    right-click-enabled: false
    # 普通右键取出数量，仅在 right-click-enabled 为 true 时生效。
    right-click-amount: 1
    # Shift + 右键取出数量，仅在 right-click-enabled 为 true 时生效。
    shift-right-click-amount: 64
    # 最多保留原物品 Lore 行数；-1 表示不截断。
    max-original-lore-lines: 5
    # 个人桶紧凑展示物的完整 Lore 模板；顺序、颜色和可用变量与公共桶相同。
    # {content} 必须独占一行；没有它会隐藏原 Lore，多个时只展开第一个。固定空行可填写 "" 或 "&7"。
    item-lore:
      - "&#38BDF8数量：&#F5B82E{amount}"
      - "{content}"
      - "&#38BDF8左键 &#D5DEE9取出 &#F5B82E{take-amount} &#D5DEE9个"
      - "&#FFD166Shift + 左键 &#D5DEE9取出 &#F5B82E{shift-take-amount} &#D5DEE9个"
    # 原 Lore 被截断时显示；{count} 为省略行数。
    omitted-lore: "&#64748B...省略 &#AAB6C5{count} &#64748B行..."
  # 原始堆叠模式配置；每个展示物按原版最大堆叠数显示，不添加紧凑模式 Lore。
  stacked:
    # 堆叠模式自己的默认排序，不读取 compact.default-sort。
    default-sort: "insertion"
    # 堆叠模式最多存储页数。
    max-pages: 2
  # 连续取物冷却，单位毫秒；0 表示关闭。
  take-delay-millis: 0
  # 是否允许玩家从自己的背包手动放入个人垃圾桶；失败时原物品保持不变。
  allow-player-put: true
  # 个人垃圾桶 GUI 布局；规则与公共垃圾桶一致，但容量和按钮完全独立配置。
  gui:
    # 小型字符布局配置，决定个人垃圾桶的行数、内容槽和按钮位置。
    layout:
      # 支持 1-6 行，每行必须正好 9 个字符；content 总数决定每页容量。
      position:
        - "xxxxxxxxx"
        - "xxxxxxxxx"
        - "xxxxxxxxx"
        - "xxxxxxxxx"
        - "xxxxxxxxx"
        - "abbsbbbbc"
      # 每个布局字符对应一个槽位类型；按钮区域不可拿取、拖动或数字键交换。
      items:
        # x 是默认个人垃圾桶内容槽字符。
        x:
          # content 为个人垃圾桶内容槽，不生成固定展示物。
          type: "content"
        # a 是默认上一页按钮字符。
        a:
          # previous-page 为上一页按钮。
          type: "previous-page"
          # 是否显示附魔光效；高版本优先使用无真实附魔的公开 API，旧版本自动降级。
          glow: false
          # CustomModelData；-1 表示不设置，1.14 以下自动忽略。
          model-id: -1
          # 从上到下选择当前版本可用的第一个材质。
          material:
            - "ARROW"
          # 没有上一页时显示 b 对应的背景物；留空则该槽为空。
          unavailable-item: "b"
        # b 是默认背景板字符。
        b:
          # background 为不可操作背景板。
          type: "background"
          # 是否显示附魔光效。
          glow: false
          # CustomModelData；-1 表示不设置，低版本自动忽略。
          model-id: -1
          # 按当前版本能力依次降级材质。
          material:
            - "BLACK_STAINED_GLASS_PANE"
            - "STAINED_GLASS_PANE"
            - "GLASS_PANE"
          # 单个空格隐藏原版物品名。
          name: " "
          # 背景板默认不显示 Lore。
          lore: []
        # s 是玩家自己的排序按钮字符。
        s:
          # sort 为玩家独立排序按钮；左键下一种，右键上一种，只刷新当前玩家视图。
          type: "sort"
          # 是否显示附魔光效。
          glow: false
          # CustomModelData；-1 表示不设置，低版本自动忽略。
          model-id: -1
          # 高低版本比较器材质候选。
          material:
            - "COMPARATOR"
            - "REDSTONE_COMPARATOR"
        # c 是默认下一页按钮字符。
        c:
          # next-page 为下一页按钮。
          type: "next-page"
          # 是否显示附魔光效。
          glow: false
          # CustomModelData；-1 表示不设置，低版本自动忽略。
          model-id: -1
          # 从上到下选择当前版本可用的第一个材质。
          material:
            - "ARROW"
          # 没有下一页时显示 b 对应的背景物。
          unavailable-item: "b"
        # 可另设字符并使用 type: actions，支持 [console]、[command]、[message]、[close] 和 PAPI 变量。
        # 也可使用 type: close 制作任意点击都会关闭菜单的按钮；name、lore、glow、model-id 均可配置。
  # 是否追踪玩家主动丢弃物品。
  # 高版本优先使用 PDC，低版本使用有过期时间的内存记录，均不会长期保存玩家引用。
  track-player-dropped-items: true
  # 自动路由因整个容器容量不足而失败时，是否清空旧内容并只重试一次。
  # 默认 false；不作用于玩家手动放入、单条目数量上限和已经部分接收的请求。
  auto-clear-when-full: false
  # 玩家从个人垃圾桶取出物品时扣除的 Vault 金额；-1 表示不扣费。
  take-cost: -1
  # 物品自动进入个人垃圾桶时的在线提示设置。
  notify:
    # 是否在垃圾进入个人垃圾桶时提示在线玩家。
    enabled: true
    # 批量提示中最多完整展示多少个物品条目；超过后会按语言文件里的 ellipsis 追加省略标记。
    max-display-items: 3
  # 玩家主动丢弃的物品被仙人掌、岩浆、火焰等损坏时，是否在短时间内回收到垃圾桶。
  damage-recovery:
    # 回收模式。
    # disabled：不处理，等同旧配置 UseModel=3。
    # global-trash：进入公共垃圾桶，等同旧配置 UseModel=1。
    # personal-trash：进入玩家个人垃圾桶，等同旧配置 UseModel=2。
    mode: disabled
    # 玩家丢出物品后多少秒内被损坏才会尝试回收，过期后不再记录归属，避免长期占用内存。
    delay-seconds: 6
