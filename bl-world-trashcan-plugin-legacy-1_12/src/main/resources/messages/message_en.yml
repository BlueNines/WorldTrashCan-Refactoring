# 插件前缀，会自动替换 {prefix}。
prefix: "&7[&bBLWorldTrashCan&7] "

# 通用无权限提示。
no-permission: "{prefix}&cYou do not have permission to use this command."

# 重载成功提示。
reload-success: "{prefix}&aConfiguration reloaded."

# 公共垃圾桶相关消息。
global-trash:
  # 公共垃圾桶未启用时提示。
  disabled: "{prefix}&cGlobal trash is disabled."
  # 玩家没有权限从公共垃圾桶取出物品。
  no-take-permission: "{prefix}&cYou do not have permission to take items from global trash."
  # 公共垃圾桶拿取冷却提示，{time} 为剩余秒数。
  take-cooldown: "{prefix}&cYou must wait {time} seconds before taking another item."
  # 公共垃圾桶 GUI 文案。
  gui:
    # GUI 标题，{page} 当前页，{max} 总页数。
    title: "&8Global Trash {page}/{max}"
    # 上一页按钮名称。
    back: "&aPrevious Page"
    # 下一页按钮名称。
    next: "&aNext Page"

# 个人垃圾桶相关消息。
personal-trash:
  # 个人垃圾桶未启用时提示。
  disabled: "{prefix}&cPersonal trash is disabled."
  # 玩家没有权限从个人垃圾桶取出物品。
  no-take-permission: "{prefix}&cYou do not have permission to take items from personal trash."
  # 玩家余额不足时提示。
  not-enough-money: "{prefix}&cYou do not have enough money to take this item."
  # 玩家成功支付取出费用，{cost} 为扣费显示。
  pay-success: "{prefix}&aPaid {cost}."
  # 个人垃圾桶 GUI 文案。
  gui:
    # GUI 标题，{player} 为玩家名。
    title: "&8{player}'s Personal Trash"

# 黑名单 GUI 相关消息。
ban-gui:
  # 世界黑名单 GUI 标题，{world} 为世界名。
  world-title: "&8World Blacklist: {world}"
  # 公共垃圾桶黑名单 GUI 标题。
  global-title: "&8Global Trash Blacklist"
  # 保存世界黑名单时世界不存在。
  world-missing: "{prefix}&cWorld not found, cannot save blacklist: {world}"
  # 世界黑名单保存成功，{count} 为物品数量。
  world-save-success: "{prefix}&aSaved world trash blacklist, items: &f{count}"
  # 世界黑名单保存失败。
  world-save-fail: "{prefix}&cFailed to save world trash blacklist. Check server logs."
  # 公共黑名单保存成功，{count} 为物品数量。
  global-save-success: "{prefix}&aSaved global trash blacklist, items: &f{count} &7(applied immediately)"
  # 公共黑名单保存失败。
  global-save-fail: "{prefix}&cFailed to save global trash blacklist. Check server logs."

# 防护和查询相关消息。
protection:
  # 关闭防丢弃模式。
  drop-mode-off: "{prefix}&aDrop protection disabled."
  # 开启防丢弃模式。
  drop-mode-on: "{prefix}&aDrop protection enabled."
  # 防丢弃模式拦截玩家丢弃。
  drop-blocked: "{prefix}&cDrop protection blocked this item drop."
  # look 查询等待玩家右键实体。
  look-prompt: "{prefix}&aRight-click an entity to inspect its name."
  # look 查询实体结果，{name} 为实体名，{type} 为实体类型。
  entity-result: "{prefix}&aEntity: &f{name} &7({type})"
  # 当前区块实体列表标题。
  chunk-entities-title: "{prefix}&aCurrent chunk entities:"
  # 当前区块实体单行，{text} 为实体名和数量。
  chunk-entity-line: "{prefix}&a{text}"
  # 手持物品查询结果，{material} 为物品类型。
  hand-item: "{prefix}&aMain hand item: &f{material}"

# 世界垃圾桶相关消息。
world-trash:
  # 当前世界禁止创建世界垃圾桶。
  create-banned-world: "{prefix}&cWorld trash cans cannot be created in this world."
  # 告示牌没有连接到可用容器。
  create-not-container: "{prefix}&cThe sign must be attached to, or placed above, a container."
  # 当前世界垃圾桶数量达到上限。
  create-reach-limit: "{prefix}&cThis world has reached the world trash can limit."
  # 创建世界垃圾桶成功，{world} 为世界名。
  create-success: "{prefix}&aCreated a world trash can in &f{world}&a."
  # 创建世界垃圾桶保存失败。
  create-save-fail: "{prefix}&cFailed to save world trash can. Check server logs."
  # 移除世界垃圾桶登记成功。
  remove-success: "{prefix}&aRemoved this world trash can registration."
# 主命令相关消息。
command:
  # 通用无权限提示。
  no-permission: "{prefix}&cYou do not have permission to use this command."
  # 重载成功提示。
  reload-success: "{prefix}&aBLWorldTrashCan reloaded."
  # 手动清理完成提示，{worlds} 世界数，{routed} 回收物品数，{items} 移除物品数，{entities} 移除实体数。
  clear-success: "{prefix}&aCleanup finished: &fworlds {worlds}&a, routed items {routed}&a, removed items {items}&a, removed entities {entities}&a."
  # Folia 不支持当前清理扫描时提示。
  folia-clear-unsupported: "{prefix}&cThis Folia build has not enabled region-safe cleanup; world entity scan was refused."
  # Folia 上一轮清理仍在运行时提示。
  folia-clear-running: "{prefix}&eThe previous Folia region-safe cleanup is still running; this request was skipped."
  # Folia 清理任务启动成功提示。
  folia-clear-started: "{prefix}&aStarted Folia region-safe cleanup; check [FoliaCleanup] logs or run /blwtc stats after it finishes."
  # 没有打开公共垃圾桶权限时提示。
  no-global-open-permission: "{prefix}&cYou do not have permission to open global trash."
  # 没有打开个人垃圾桶权限时提示。
  no-personal-open-permission: "{prefix}&cYou do not have permission to open personal trash."
  # /blwtc help 输出，每行一条。
  help:
    - "&b/blwtc help &7- Show help"
    - "&b/blwtc platform &7- Show this build's capabilities"
    - "&b/blwtc clear &7- Run one cleanup immediately"
    - "&b/blwtc global &7- Open global trash"
    - "&b/blwtc personal &7- Open personal trash"
    - "&b/blwtc dropmode &7- Toggle drop protection"
    - "&b/blwtc look &7- Inspect held item and right-clicked entity type"
    - "&b/blwtc ban &7- Open this world's trash blacklist"
    - "&b/blwtc globalban &7- Open the global trash blacklist"
    - "&b/blwtc stats &7- Show cleanup and trash statistics"
    - "&b/blwtc add <amount> &7- Add world trash slots to your current world"
    - "&b/blwtc add <world> <amount> &7- Add world trash slots to a specific world"
    - "&b/blwtc debugopen <player> <global|personal> &7- Test opening a GUI"
    - "&b/blwtc debugworldtrash <player> &7- Create and register a test world trash can"
    - "&b/blwtc debugroute <player> <world|personal|global> <Material> <amount> &7- Test a trash route"
    - "&b/blwtc debugdrop <player> <Material> <amount> [owner] &7- Spawn a test dropped item"
    - "&b/blwtc debugdamage <player> <Material> <amount> &7- Test damage recovery"
    - "&b/blwtc debugstock &7- Show backend trash stock"
    - "&b/blwtc debugsummary <player> &7- Show backend test summary"
    - "&b/blwtc debugplayer <player> <dropmode|look|ban|globalban> &7- Test player-only entry points"
    - "&b/blwtc reload &7- Reload the plugin"
  # 平台信息标题，{platform} 为平台 ID。
  platform:
    header: "{prefix}&aCurrent platform: &f{platform}"
    # 平台能力已启用文案。
    enabled: "&aEnabled"
    # 平台能力已禁用文案。
    disabled: "&7Disabled"
    # 平台能力单行，{capability} 为能力名，{state} 为启用状态。
    line: "&7- &f{capability}&7: {state}"
  # /blwtc stats 输出。
  stats:
    header: "{prefix}&aCleanup statistics:"
    worlds: "&7- &fWorlds: &a{worlds}"
    routed: "&7- &fRouted items: &a{routed} &7(world {world}, personal {personal}, global {global})"
    removed-items: "&7- &fRemoved items: &a{items}"
    removed-entities: "&7- &fRemoved entities: &a{entities}"
    global-pages: "&7- &fGlobal trash pages: &a{pages}"
    global-items: "&7- &fGlobal trash items: &a{items} &7(stacks {stacks})"
    personal-loaded: "&7- &fLoaded personal trash: &a{count}"
    remaining: "&7- &fSeconds until next cleanup: &a{seconds}"
  # 找不到世界时提示，{world} 为输入的世界名。
  world-not-found: "{prefix}&cWorld not found: &f{world}"
  # 控制台执行 add 未指定世界时提示。
  add-console-world-required: "{prefix}&cConsole must specify a world name when using add."
  # add 数量不是正数时提示。
  add-positive-required: "{prefix}&cAmount must be greater than 0."
  # add 成功提示，{world} 为世界名，{count} 为调整后的上限。
  add-success: "{prefix}&aWorld &f{world} &atrash can limit is now &f{count}&a."
  # add 用法提示。
  add-usage:
    - "&cUsage: /blwtc add <amount>"
    - "&cUsage: /blwtc add <world> <amount>"
  # 没有防丢弃模式权限时提示。
  no-dropmode-permission: "{prefix}&cYou do not have permission to use drop protection."
  # 没有 look 查询权限时提示。
  no-look-permission: "{prefix}&cYou do not have permission to use look inspection."
  # 没有世界黑名单权限时提示。
  no-world-ban-permission: "{prefix}&cYou do not have permission to open the world blacklist."
  # 没有公共黑名单权限时提示。
  no-global-ban-permission: "{prefix}&cYou do not have permission to open the global blacklist."
  # 非玩家执行玩家命令时提示。
  only-player: "{prefix}&cThis command can only be used by players."
  # 玩家不在线时提示，{player} 为玩家名。
  player-offline: "{prefix}&cPlayer is not online: {player}"
