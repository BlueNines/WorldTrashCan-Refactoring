name: BLWorldTrashCan
version: ${project.version}
main: pixeltech.bluenine.blworldtrashcan.plugin.legacy.BLWorldTrashCanLegacyPlugin
author: BlueNine
softdepend:
  - Vault
  - PlaceholderAPI
commands:
  blworldtrashcan:
    description: BLWorldTrashCan 主命令
    aliases:
      - blwtc
  WorldListTrashCan:
    description: WorldListTrashCan 旧命令兼容入口
    aliases:
      - WTC
      - wtc
permissions:
  blworldtrashcan.admin:
    description: 允许重载插件并查看调试信息
    default: op
  blworldtrashcan.use:
    description: 允许使用基础垃圾桶功能
    default: true
  blworldtrashcan.world.create:
    description: 允许创建世界垃圾桶
    default: true
  blworldtrashcan.global.open:
    description: 允许打开公共垃圾桶
    default: true
  blworldtrashcan.global.take:
    description: 允许从公共垃圾桶取出物品
    default: true
  blworldtrashcan.global.put:
    description: 允许向公共垃圾桶放入物品
    default: true
  blworldtrashcan.personal.open:
    description: 允许打开个人垃圾桶
    default: true
  blworldtrashcan.personal.take:
    description: 允许从个人垃圾桶取出物品
    default: true
  blworldtrashcan.personal.put:
    description: 允许向个人垃圾桶放入物品
    default: true
