# 新版配置结构版本。
# 插件通过该值区分旧版单文件配置与当前拆分配置；请勿手动删除或降低。
config-schema-version: 2

# 语言文件名。
# 默认使用 messages/message_zh.yml；后续可切换到其他语言文件。
language: "message_zh.yml"

# 是否开启调试日志。
# 默认 false；开启后会输出配置加载、功能启停、清理决策等额外信息。
debug: false

# 当前重构版配置文件更新设置。
config-update:
  # 是否自动把仍受支持的旧配置写法保守更新为当前格式。
  # 默认 false：插件不会改写已有配置，旧写法继续兼容；检测到可更新项时只在控制台提示。
  # 改为 true：启动或执行 /wtc reload 时，先生成唯一 .bak 备份，再原地注释旧节点并添加新节点。
  # 备份失败、YAML 无法解析或节点范围不明确时会取消更新，绝不覆盖原文件。
  enabled: false
