# 当前产物的平台线。
# bukkit-1.13-1.15 产物固定使用 Bukkit/Spigot 1.13-1.15 实现，不会装入 legacy、modern Paper 或 Folia 大块实现。
target: "bukkit-1.13-1.15"

# 是否严格检查功能所需能力。
# 默认 true；能力不足时功能会拒绝启用并输出原因，不会静默半启用。
strict-capability-check: true

# 手动禁用的平台能力。
# 默认留空；仅排查兼容问题时使用。1.13 兼容产物默认不启用 item-pdc-tag。
disabled-capabilities: []
