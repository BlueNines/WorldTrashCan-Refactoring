# 清理周期，单位秒。
# 默认 360 秒；设为 0 时只允许管理员手动触发清理。
interval-seconds: 360

# 跳过清理的世界名。
# 默认示例为 testWorld；留空请写 []。
ignored-worlds:
  - "testWorld"

# 扫地启动门禁。
# 这些配置只决定“本轮扫地是否启动”，不会改变具体哪些物品或实体会被清理。
guards:
  # 在线玩家低于该值时跳过本轮扫地。
  # 默认 1，表示无人在线时不扫地；设为 0 可允许无人在线时继续自动扫地。
  min-online-players: 1
  # 会被本轮扫地处理的目标实体数量低于该值时跳过本轮扫地。
  # 默认 150，避免实体很少时仍频繁扫描和清理；设为 0 可关闭实体数量门禁。
  min-total-entities: 150

# Folia 专用清理保护。
# 普通 Bukkit、Paper、Legacy 运行时会读取但不会使用这些设置。
folia:
  # 单轮 Folia 清理最多执行多少秒；超时后会释放清理状态，迟到的 region 任务不再计入本轮统计。
  timeout-seconds: 30
  # 单轮最多扫描多少个已加载 chunk；0 表示不限制。大型生存服建议保持默认或更低，避免一次扫完整个加载世界。
  max-chunks-per-cleanup: 4096
  # 每批向 Folia RegionScheduler 派发多少个 chunk 扫描任务；数值越大瞬时压力越高。
  chunk-batch-size: 64
  # 每批 chunk 扫描任务之间间隔多少 tick；最小 1，默认 1 用来削峰。
  chunk-batch-delay-ticks: 1

# 不回收也不删除的物品类型。
# 使用当前版本平台标准化后的 Material 名称。
ignored-materials:
  - "DIAMOND"

# 显示名包含以下片段时跳过清理。
# 可用于保护特殊商店、祭坛、任务物品。
ignored-name-fragments:
  - "shopLocation"
  - "ALTAR"

# lore 包含以下片段时跳过清理。
# 默认保护 QuickShop 一类带位置 lore 的物品。
ignored-lore-fragments:
  - "shopLocation"

# 实体清理规则。
entities:
  # 是否启用实体清理总开关。
  # 默认 true；改为 false 时，经验球、怪物、动物、投射物、实体黑名单等实体清理规则都会整体跳过。
  enabled: true
  # 是否清理经验球。
  clear-experience-orbs: true
  # 是否清理怪物。
  clear-monsters: true
  # 是否清理动物或普通生物。
  clear-animals: false
  # 是否清理投射物。
  clear-projectiles: true
  # 是否清理带自定义名的实体。
  clear-named-entities: false
  # 是否跳过船内实体。
  ignore-entities-in-boat: false
  # 实体白名单；命中后不清理，支持 * 通配。
  whitelist:
    - "VILLAGER"
    - "*golem*"
    - "WITHER"
    - "Ender Dragon"
  # 实体黑名单；命中后强制清理，支持 * 通配。白名单优先级更高。
  blacklist:
    - "FLAMMPFEIL.SLASHBLADE_BLADESTAND"

# 清理通知配置。
# 这些通知都属于扫地功能的一部分，因此统一放在 cleanup.yml 中维护。
notify:
  # 聊天栏提醒。
  chat:
    # 是否启用聊天提醒。
    enabled: true
    # 清理完成消息点击后执行的命令。
    click-command: "/worldlisttrashcan globaltrash"
    # 倒计时聊天提醒，格式：剩余秒数;内容。
    messages:
      - "60;&#5AC8FA还剩下 &#FFD16660 &#C9D4E2秒清理物品和实体"
      - "30;&#5AC8FA还剩下 &#FFD16630 &#C9D4E2秒清理物品和实体"
      - "10;&#5AC8FA还剩下 &#FFD16610 &#C9D4E2秒清理物品和实体"
      - "5;&#FFD1665秒"
      - "3;&#FFD1663秒"
      - "2;&#FFD1662秒"
      - "1;&#FFD1661秒"
      - "0;&#5AC8FA清理成功 &#64748B| &#C9D4E2回收 &#FFD166%DealItemSum% &#C9D4E2个物品，公共垃圾桶加入 &#FFD166%GlobalTrashAddSum% &#C9D4E2个物品，清理生物 &#FFD166%EntitySum% &#C9D4E2个 &#E7C873(点我打开垃圾桶)"
      - "-4;&#FFD166Folia 清理超时 &#64748B| &#C9D4E2已释放清理状态，下一轮会继续处理剩余 chunk"
      - "-5;&#FFD166本轮扫地已跳过 &#64748B| &#C9D4E2原因: &#FFD166%CleanupSkipReason% &#C9D4E2在线 &#FFD166%CleanupOnlinePlayers%/%CleanupMinOnlinePlayers% &#C9D4E2目标实体 &#FFD166%CleanupTargetEntities%/%CleanupMinTotalEntities%"
      # -1 表示本轮清理完成但公共垃圾桶未刷新，-2 表示公共垃圾桶已刷新，-3 表示公共垃圾桶不会自动刷新，-4 表示 Folia 本轮清理超时但已释放状态，-5 表示本轮被扫地启动门禁跳过。
      - "-1;&#C9D4E2还有 &#FFD166%ClearGlobalCount% &#C9D4E2次清理，公共垃圾桶会刷新"
      - "-2;&#5AC8FA公共垃圾桶的物品已刷新"
      - "-3;&#C9D4E2公共垃圾桶不会自动刷新"

  # 控制台清理日志；独立于聊天提醒，即使 chat.enabled 为 false 也可以继续记录。
  console:
    # 是否输出倒计时、完成文案和清理明细；旧配置缺少本项时兼容读取 notify.chat.console-log。
    enabled: true
    # 清理成功或 Folia 部分超时时，是否输出按实体名称和类型聚合的详细统计。
    details-enabled: true
    # 最多显示清理数量最高的实体分组数；默认 10，运行时限制范围为 1-100。
    max-entries: 10
    # 实体明细格式；名称优先使用自定义名，其次 getName()，最后使用 getType()。
    # 可用占位符：{name} 实体名称、{type} 小写实体类型、{count} 清理数量。
    entity-format: "{name}_{type}: {count}"
    # 物品汇总格式；数量是本轮成功入桶或直接删除的物品实际个数，不是掉落物堆叠数。
    # 可用占位符：{count} 物品实际数量。
    items-format: "items: {count}"
    # 实体分组超过 max-entries 时，其余未逐项显示实体的汇总格式。
    # 可用占位符：{count} 未逐项显示的实体总数。
    others-format: "others: {count}"

  # ActionBar 提醒。
  actionbar:
    # 是否启用 ActionBar。
    enabled: true
    # 倒计时 ActionBar 提醒，格式：剩余秒数;内容。
    messages:
      - "60;&#0F172A▌ &#5AC8FA还剩下 &#FFD166&l60 &#C9D4E2秒清理物品和实体"
      - "30;&#0F172A▌ &#5AC8FA还剩下 &#FFD166&l30 &#C9D4E2秒清理物品和实体"
      - "10;&#0F172A▌ &#5AC8FA还剩下 &#FFD166&l10 &#C9D4E2秒清理物品和实体"
      - "5;&#0F172A▌ &#FFD166&l5秒"
      - "3;&#0F172A▌ &#FFD166&l3秒"
      - "2;&#0F172A▌ &#FFD166&l2秒"
      - "1;&#0F172A▌ &#FFD166&l1秒"
      - "0;&#0F172A▌ &#5AC8FA清理成功 &#64748B| &#C9D4E2公共垃圾桶加入 &#FFD166%GlobalTrashAddSum% &#C9D4E2个物品，清理生物 &#FFD166%EntitySum% &#C9D4E2个"
      - "-4;&#0F172A▌ &#FFD166Folia 清理超时 &#64748B| &#C9D4E2已释放状态，下一轮继续"
      - "-5;&#0F172A▌ &#FFD166本轮扫地已跳过 &#64748B| &#C9D4E2%CleanupSkipReason% &#FFD166%CleanupOnlinePlayers%/%CleanupMinOnlinePlayers% &#C9D4E2目标 &#FFD166%CleanupTargetEntities%/%CleanupMinTotalEntities%"
      # -1 表示本轮清理完成但公共垃圾桶未刷新，-2 表示公共垃圾桶已刷新，-3 表示公共垃圾桶不会自动刷新，-4 表示 Folia 本轮清理超时但已释放状态，-5 表示本轮被扫地启动门禁跳过。
      - "-1;&#0F172A▌ &#C9D4E2还有 &#FFD166%ClearGlobalCount% &#C9D4E2次清理，公共垃圾桶会刷新"
      - "-2;&#0F172A▌ &#5AC8FA公共垃圾桶的物品已刷新"
      - "-3;&#0F172A▌ &#C9D4E2公共垃圾桶不会自动刷新"

  # BossBar 提醒。
  bossbar:
    # 是否启用 BossBar。
    enabled: false
    # 倒计时 BossBar 提醒，格式：剩余秒数;内容;样式;颜色。
    # 样式可用 SOLID、SEGMENTED_6、SEGMENTED_10、SEGMENTED_12、SEGMENTED_20；颜色可用 PINK、BLUE、RED、GREEN、YELLOW、PURPLE、WHITE。
    # -1 表示本轮清理完成但公共垃圾桶未刷新，-2 表示公共垃圾桶已刷新，-3 表示公共垃圾桶不会自动刷新，-4 表示 Folia 本轮清理超时但已释放状态。
    messages:
      - "30;&#5AC8FA&l即将清理物品和实体;SOLID;BLUE"
      - "10;&#FFD166&l即将清理物品和实体;SOLID;YELLOW"
      - "5;&#FFD166&l5秒;SEGMENTED_20;YELLOW"
      - "3;&#FFD166&l3秒;SEGMENTED_20;YELLOW"
      - "2;&#FFD166&l2秒;SEGMENTED_20;YELLOW"
      - "1;&#FFD166&l1秒;SEGMENTED_20;YELLOW"
      - "0;&#5AC8FA清理成功，公共垃圾桶加入 &#FFD166%GlobalTrashAddSum% &#C9D4E2个物品，清理生物 &#FFD166%EntitySum% &#C9D4E2个;SEGMENTED_20;BLUE"
      - "-4;&#FFD166Folia 清理超时，已释放状态，下一轮继续;SEGMENTED_20;YELLOW"
      - "-5;&#FFD166本轮扫地已跳过：%CleanupSkipReason%，在线 %CleanupOnlinePlayers%/%CleanupMinOnlinePlayers%，目标实体 %CleanupTargetEntities%/%CleanupMinTotalEntities%;SEGMENTED_20;YELLOW"
      - "-1;&#C9D4E2还有 &#FFD166%ClearGlobalCount% &#C9D4E2次清理，公共垃圾桶会刷新;SEGMENTED_20;BLUE"
      - "-2;&#5AC8FA公共垃圾桶的物品已刷新;SEGMENTED_20;BLUE"
      - "-3;&#C9D4E2公共垃圾桶不会自动刷新;SEGMENTED_20;BLUE"

  # Title 提醒。
  title:
    # 是否启用 Title。
    enabled: false
    # 倒计时 Title 提醒，格式：剩余秒数;主标题;副标题。
    messages:
      - "60;&#5AC8FA还剩下 &#FFD16660 &#5AC8FA秒;&#C9D4E2清理物品和实体"
      - "30;&#5AC8FA还剩下 &#FFD16630 &#5AC8FA秒;&#C9D4E2清理物品和实体"
      - "10;&#5AC8FA还剩下 &#FFD16610 &#5AC8FA秒;&#C9D4E2清理物品和实体"
      - "5;&#FFD1665秒;"
      - "3;&#FFD1663秒;"
      - "2;&#FFD1662秒;"
      - "1;&#FFD1661秒;"
      - "0;&#5AC8FA清理成功;&#C9D4E2公共垃圾桶加入 &#FFD166%GlobalTrashAddSum% &#C9D4E2个物品，清理生物 &#FFD166%EntitySum% &#C9D4E2个"
      - "-4;&#FFD166Folia 清理超时;&#C9D4E2已释放状态，下一轮会继续处理"
      - "-5;&#FFD166扫地已跳过;&#C9D4E2%CleanupSkipReason% 在线 %CleanupOnlinePlayers%/%CleanupMinOnlinePlayers% 目标实体 %CleanupTargetEntities%/%CleanupMinTotalEntities%"
      # -1 表示本轮清理完成但公共垃圾桶未刷新，-2 表示公共垃圾桶已刷新，-3 表示公共垃圾桶不会自动刷新，-4 表示 Folia 本轮清理超时但已释放状态，-5 表示本轮被扫地启动门禁跳过。
      - "-1;&#C9D4E2还有 &#FFD166%ClearGlobalCount% &#C9D4E2次清理，公共垃圾桶会刷新;"
      - "-2;&#5AC8FA公共垃圾桶的物品已刷新;"
      - "-3;&#C9D4E2公共垃圾桶不会自动刷新;"

  # 声音提醒。
  sound:
    # 是否启用提示音。
    enabled: true
    # 倒计时声音提醒，格式：剩余秒数;声音名,音量,音调。
    messages:
      - "5;entity.experience_orb.pickup,0.4,0.2"
      - "3;entity.experience_orb.pickup,0.4,0.4"
      - "2;entity.experience_orb.pickup,0.4,0.6"
      - "1;entity.experience_orb.pickup,0.4,0.8"
      - "0;entity.experience_orb.pickup,0.4,1"

  # 控制台命令提醒。
  command:
    # 是否启用倒计时命令。
    enabled: false
    # 倒计时命令，格式：剩余秒数;命令1;命令2。
    commands:
      - "0;say &#5AC8FA怪物已清理成功"
